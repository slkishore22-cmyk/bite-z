<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" />
    <title>Bitez — Offline</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0; padding: 0;
        height: 100%;
        background: #F5F5F7;
        color: #1D1D1F;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100dvh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .badge {
        width: 72px; height: 72px; border-radius: 22px;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255,255,255,0.8);
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
        display: grid; place-items: center;
        margin-bottom: 20px;
        font-size: 32px;
      }
      h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
      p  { font-size: 15px; color: #86868B; margin: 0 0 24px; max-width: 320px; line-height: 1.45; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #0071E3; color: #fff;
        height: 48px; padding: 0 22px; border-radius: 9999px;
        font-size: 16px; font-weight: 700;
        box-shadow: 0 4px 14px 0 rgba(0,113,227,0.3);
      }
      button:active { transform: scale(0.98); }
      .hint { margin-top: 14px; font-size: 12px; color: #86868B; }
      .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#EF4444; vertical-align:middle; margin-right:6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">📡</div>
      <h1>You're offline</h1>
      <p>We couldn't reach Bitez right now. Check your connection — your cart and recent orders are safe.</p>
      <button id="retry" type="button">Try again</button>
      <div class="hint"><span class="dot"></span><span id="status">No internet connection</span></div>
    </div>
    <script>
      var btn = document.getElementById('retry');
      var status = document.getElementById('status');
      function go() { location.replace('/app/home'); }
      btn.addEventListener('click', function () {
        if (navigator.onLine) go();
        else location.reload();
      });
      window.addEventListener('online', function () {
        status.textContent = 'Back online — reloading…';
        setTimeout(go, 400);
      });
    </script>
  </body>
</html>
